AutoName: NFC Cardholder
Summary: Copy NFC cards into slots and transmit them back to a reader
Description: |-
  Ten card slots on one screen; each slot copies an NFC tag, transmits the copied
  card back to a reader through host card emulation, or deletes it.
  .
  Copying stores everything the tag hands out: UID, technology list, ATQA and SAK,
  historical bytes, the NDEF message, every ISO-DEP application that answers a
  SELECT, and the MIFARE memory a known key unlocks.
  .
  Transmitting replays the recorded answers: SELECT by AID returns the stored FCI,
  recorded command pairs answer verbatim and copied NDEF is served as an NFC Forum
  Type 4 Tag. Android can only emulate ISO-DEP applications, so MIFARE Classic and
  similar low level tags are copied for inspection but cannot be transmitted. The
  phone always presents its own UID; payment cards are not supported.
  .
  The app has no network permission, no tracking, no advertising and no third party
  services. Card data stays in the private storage of the app.

