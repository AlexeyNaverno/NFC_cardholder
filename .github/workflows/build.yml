name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Assemble, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Assemble debug APK, run unit tests and lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug 2>&1 | tee /tmp/build.log

      - name: Surface build errors as check annotations
        if: failure()
        run: |
          touch /tmp/build.log
          grep -E "^e: |error: |Caused by: |What went wrong:" /tmp/build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -A 12 "What went wrong:" /tmp/build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -A 3 " FAILED" /tmp/build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")) + \
                      sorted(glob.glob("app/build/outputs/**/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for failure in list(case.iter("failure")) + list(case.iter("error")):
                      name = "%s > %s" % (case.get("classname"), case.get("name"))
                      message = (failure.get("message") or "").replace("\n", " ")
                      print("::error::%s :: %s" % (name, message[:300]))
          PY
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
